name: Go
on: [push, pull_request]
jobs:

  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Older Go versions need an older fatih/color (and its dependencies).
          - go: '1.12'
            color: v1.9.0
          - go: '1.18'
            color: v1.16.0
          - go: '1.22'
            color: v1.16.0
          - go: '1.26'
          - go: '1.27'
    steps:

    - name: Check out code with the LIVR test suite submodule
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Set up Go ${{ matrix.go }}
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go }}
        cache: false

    # The repository has no go.mod (v2.0.0 is used as v2.0.0+incompatible),
    # so the tests run with a temporary one.
    - name: Create a temporary go.mod
      env:
        COLOR_VERSION: ${{ matrix.color }}
      run: |
        go mod init github.com/k33nice/go-livr
        if [ -n "$COLOR_VERSION" ]; then go get "github.com/fatih/color@$COLOR_VERSION"; fi
        go mod tidy

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -v ./...
